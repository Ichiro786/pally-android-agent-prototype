name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Fetch and verify official Pally icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error https://pally.com/brand/app-icon.png -o app/src/main/res/drawable-nodpi/pally_logo.png
          echo 'd0f46d83c54386153c12f21472166299babade7139a0dd7c7c9ea915ab7118ea  app/src/main/res/drawable-nodpi/pally_logo.png' | sha256sum --check
      - name: Compile debug APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
