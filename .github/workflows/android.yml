name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      approved_chat_source:
        description: 'Temporary HTTPS URL for the approved chat activity source (SHA-256 pinned in this workflow)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply-approved-source:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_chat_source != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and verify approved launcher source
        env:
          SOURCE_URL: ${{ inputs.approved_chat_source }}
        run: |
          case "$SOURCE_URL" in
            https://my.pally.com/f/*\?download=1) ;;
            *) echo "Only the temporary my.pally.com download URL is accepted"; exit 1 ;;
          esac
          mkdir -p app/src/main/java/com/ichiro/pallyagent
          curl --fail --location --silent --show-error "$SOURCE_URL" -o app/src/main/java/com/ichiro/pallyagent/ApprovedChatActivity.kt
          echo '12e99f8a55b7d8b956244228506d0f3eccb383652357f5da36bccd1cc81d1cab  app/src/main/java/com/ichiro/pallyagent/ApprovedChatActivity.kt' | sha256sum --check
      - name: Commit verified source
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/ichiro/pallyagent/ApprovedChatActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Align chat screen with approved UI reference'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ always() && (needs.apply-approved-source.result == 'success' || needs.apply-approved-source.result == 'skipped') }}
    needs: [apply-approved-source]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply-approved-source.outputs.source_sha || github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify runner Gradle
        run: gradle --version
      - name: Fetch and verify official Pally icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl --fail --location --silent --show-error https://pally.com/brand/app-icon.png -o app/src/main/res/drawable-nodpi/pally_logo.png
          echo 'd0f46d83c54386153c12f21472166299babade7139a0dd7c7c9ea915ab7118ea  app/src/main/res/drawable-nodpi/pally_logo.png' | sha256sum --check
      - name: Compile debug APK and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
